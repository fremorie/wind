<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sunday ride</title>
        <link rel="icon" type="image/webp" href="/favicon.webp" sizes="256x256" />

        <!-- Fetched at page load rather than when the menu first opens: the paper
         is ruled on a fixed line height, so a late font swap would reflow the
         text off the lines. By the time anyone clicks Menu it is cached. -->
        <link
            rel="preload"
            href="/fonts/Playpen_Sans/PlaypenSans-VariableFont_wght.ttf"
            as="font"
            type="font/ttf"
            crossorigin
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
